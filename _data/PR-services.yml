- title: "Core Messaging Workshops"
  image: "core-messaging-workshops.svg"
  alt: "Core messaging workshops"
  description:
      - type: paragraph
        text: To create hyper-personalised content, we need to take a deep dive into your core messaging, brand story and target audience. We'll run an online session to explore your&#58;
      - type: list
        items:
          - Brand Story
          - Customer Avatars
          - Market Positioning & Target Markets
          - Purpose-Driven Brand
          - Tone of Voice
      - type: paragraph
        text: Filled with honest advice, our session provides powerful insights into what makes you truly special. You'll receive a brand book from this workshop that can provide the foundation for all work going forward.

- title: "Visual Identity Workshops"
  image: "visual-identity-workshops.svg"
  alt: "visual identity workshops"
  description:
      - type: paragraph
        text: Before you can represent your brand online, you need to have a strong visual identity. During our visual identity workshop, we'll help you define the fundamental building blocks for creating an appealing design. We'll explore&#58;
      - type: list
        items:
          - Design Inspirations
          - Colours
          - Typography
          - Logos
          - Dos and Don'ts
      - type: paragraph
        text: Filled with expert advice and support, our workshop will set the foundations for all future design work. You'll receive a brand book with all your design preferences.

- title: "Tone of Voice Workshops"
  image: "tone-voice-workshops.svg"
  alt: "Tone of voice workshops"
  description:
      - type: paragraph
        text: Your brand voice should embody everything that's special about your brand and represent your personality, ethos, and resonate with your target audience.We'll take you through our unique half-day tone of voice workshop, which will explore&#58;
      - type: list
        items:
          - The audience you are trying to reach
          - The psychology behind your customer avatar
          - Brand Essence & Personality
          - Values
          - Ethos
          - Messaging
          - Tone of Voice
      - type: paragraph
        text: We'll then deliver a tone of voice guidebook that explains clearly to your team and marketing partners how to communicate with your target audience.

- title: "Content Marketing Strategy"
  image: "content-marketing-strategy.svg"
  alt: "content marketing strategy"
  description:
      - type: paragraph
        text: Once we understand the true essence of your business, we'll transform these insights into a content strategy. As part of our strategy, we'll research your competitors, industry trends and 'hot' topics to present ideas for regular long-form content.We'll investigate concepts to determine SEO potential and create a content calendar unique to your brand. This calendar will include the following&#58;
      - type: list
        items:
          - Article Summary/Snapshot
          - Content Pillars
          - Target Audience/Market
          - Proposed Title
          - SEO Keywords & Difficulty Ranking
