accordion:
  - title: Blog Content
    text:
      - Producing regular blog content is a highly-effective way of capturing keywords for SEO and providing a stream of engaging content to direct potential customers to your website.
      - We interview key stakeholders from your business to turn their expert insights into a professionally-written article. We can also adopt this same approach to create fully-optimised ghost articles for busy executives or in-house marketing teams.

  - title: Thought-Leadership Articles
    text:
      - apturing unique insights from your in-house experts allows you to establish your brand as an innovative market leader.
      - We conduct virtual interviews with key stakeholders from your business to turn their expert insights into professionally-written articles. We can also adopt this same approach to create fully-optimised ghost articles for busy executives or in-house marketing teams.

  - title: eBooks
    text:
      - Downloadable eBooks are a great way to generate qualified leads and nurture relationships with prospective customers.
      - We'll conduct in-depth desk research and interviews to get to grips with the subject matter. We'll then create an in-depth eBook full of unique insights, accompanied by creative design.

  - title: Case Studies
    text:
      - When you're trying to win new work, customers love to see detailed examples of past projects you've worked on.
      - We'll use our proven formula to gather key information that uncovers important details about the project. We'll then transform these insights into a comprehensive portfolio of case studies to showcase your best work.
