stage:
  - title: Ideation Sessions
    text: We believe the best marketing results come through collaboration. So, we'll meet with you on a regular basis to discuss content ideas, ask questions about your business goals and current challenges. We'll then use these insights to create a content marketing strategy that aligns with your current business needs and helps you overcome market barriers.
    image: ideation-sessions.webp
    image_alt: A woman standing by a flip chart during a brainstorming session, holding a marker and discussing blockchain.

  - title: Content Marketing Strategy
    text: Once we have a solid understanding of what you want to achieve, we'll create an actionable strategy to make it happen. Our content strategy is formed around core content pillars, your target audience and market, and of course potential keywords for search engine optimisation (SEO). This content marketing strategy will then help nurture prospects through the funnel and make it easier to build a loyal following and boost revenue.
    image: content-marketing-strategy.webp
    image_alt: Colorful sticky notes on a glass wall with words like relatable, driven, and forward-thinking for content strategy brainstorming.

  - title: Content Creation
    text: Now the real fun begins. Our team conducts expert interviews with your in-house team to gather unique insights and then use our marketing skills to create articles that resonate with your target audience. We adapt our tone of voice to fit your brand and conduct thorough research to make sure we’re producing highly-relevant content that packs a punch.
    image: content-creation.webp
    image_alt: Printed marketing materials showing cybersecurity graphics, business branding, and professional articles.
