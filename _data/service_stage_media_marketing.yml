title: Our Social Media Marketing Services
subtitle: Here's how we'll enhance your social media presence with regular content and increase audience engagement&#58; 
stage:
  - stage_label: true
    title: Conducting A Half-Day Brand Workshop
    text:
      - type: paragraph
        text: Your voice embodies everything special about you. It needs to represent your personality, ethos, and resonate with your target audience.
      - type: paragraph
        text: To capture your unique voice, we begin by running a half-day workshop. You'll engage in open and honest conversations with our team to help you gain clarity and insight into creating a strategic course of action.
      - type: paragraph
        text: In this workshop, we'll explore&#58;
      - type: list
        items:
          - Brand essence & personality
          - Values and ethos
          - What your customers/clients want to hear
          - Your personal messaging
          - Tone of voice
      - type: paragraph
        text: As a result of the workshop, our team of expert Copywriters will be able to create laser-sharp messaging that makes you stand out from the crowd. By building a great social media presence, you'll have a solid foundation for distributing other types of content and building your personal brand further than ever before.
    image: conducting-half-day-brand-workshop.webp
    image_alt: Two women in a small meeting room discussing brand strategy with sticky notes, a laptop, and notebooks on the table.

  - stage_label: true
    title: Building A Social Media Roadmap
    text:
      - type: paragraph
        text: The insights gained from the brand workshop will help us identify core themes (content pillars) and create a framework for regular social content publications that are unique to your brand.
      - type: paragraph
        text: This roadmap will identify the best topics for your content, channels for engagement, and how you can connect with your audience.
    image: content-creation.webp
    image_alt: Printed content layouts and website designs spread out on a surface, including images and branding for Anderson Strathern.

  - stage_label: true
    title: Creating Engaging Social Content
    text:
      - type: paragraph
        text: Our team will use the information they've collected to create thought-provoking social media posts with supporting eye-catching imagery. The content and visuals will help engage your audience and ultimately boost your brands recognition. 
      - type: paragraph
        text: Our social media service also works well in conjunction with thought leadership articles, which we can promote to increase traffic to your webpage.
    image: creating-engaging-social-content.webp
    image_alt: Infographic slides outlining strategies and statistics for digital banking compliance and customer engagement.

  - stage_label: true
    title: Tracking Progress with a Strategy Report
    text:
      - type: paragraph
        text: To help you stay ahead of the game, our team will produce an impact report showcasing the results delivered by our social media strategy.
      - type: paragraph
        text: The transparency of the report will give you full visibility and control over your strategy. You can see exactly what's working well for your brand and what will need a different approach in the future.
    image: tracking-progress-strategy-report.webp
    image_alt: Desktop monitor displaying a Product & Marketing Dashboard with graphs and charts, alongside a coffee cup and eyeglasses on a notebook.

  - stage_label: true
    title: Hosting Regular Content Meetings
    text:
      - type: paragraph
        text: With the technology space rapidly evolving, we always keep our finger on the pulse to learn about the latest advancements. After all, no one wants to read old news. So, we meet once a month to discuss post ideas, upcoming events/company news, awards or experiences that will inspire the next round of meaningful content.
      - type: paragraph
        text: These short meetings will allow us to continue creating social media content that excites your audience and encourages more engagement.
    image: hosting-regular-content-meetings.webp
    image_alt: A group of four colleagues smiling and collaborating at a table with laptops and documents in a modern office setting.
