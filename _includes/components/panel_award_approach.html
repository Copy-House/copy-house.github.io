{%- assign panel = page.award_approach -%}
{%- assign data_entries = site.data.service_award_approach.approach -%}

{%- if panel -%}
  <section class="section section-award-approach pt-10 pb-8 gradient-black-purple text-white" aria-labelledby="award-approach-title-{{ include.index }}">
    <div class="container">
      <div class="row justify-content-center g-md-0">
        <div class="col-12 col-md-8 col-lg-6 text-center">
          <h2 id="award-approach-title-{{ include.index }}" class="h3">
            {{ panel.h2 }}
          </h2>

          {%- for item in data_entries -%}
            <article class="mt-4 mx-md-6 approach_{{ forloop.index }}">
              <figure>
                <img
                  src="{{ site.assets_path }}/services/approach_{{ forloop.index }}.webp" 
                  alt="{{ item.alt | default: 'Illustration for step ' | append: forloop.index }}"
                  loading="lazy"
                  width="65"
                  height="65"
                >
                <figcaption class="mt-3 pt-4">
                  <p>{{ item.text }}</p>
                </figcaption>
              </figure>
            </article>
          {%- endfor -%}

        </div>
      </div>
    </div>
  </section>
{%- endif -%}
