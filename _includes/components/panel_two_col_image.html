{%- assign panel = site.data.two_col -%}

  <section class="section section-two-col py-7 py-md-4 text-bg-dark section-triangle section-triangle--bottom">
    <div class="container">
      <article class="row justify-content-md-end align-items-center flex-md-row-reverse">
        {%- if panel.image -%}
        <div class="col-12 col-md-3 mb-4 mb-md-0">
          <figure class="overflow-hidden rounded-4 mb-3 mb-md-0">
            <img
              src="{{ site.assets_path }}/two-col/{{ panel.image }}"
              alt="{{ panel.alt | default: panel.title | escape }}"
              loading="lazy"
              width="450"
              height="500"
              class="object-fit-cover w-100"
            >
            {% if panel.image_caption %}
              <figcaption class="visually-hidden">{{ panel.image_caption }}</figcaption>
            {% endif %}
          </figure>
        </div>
        {%- endif -%}

        <div class="col-12 col-md-6">
          <h2 class="h1 mb-4 h2">{{ panel.title }}</h2>

          {% for paragraph in panel.text %}
            {{ paragraph | markdownify | strip | raw }}
          {% endfor %}

          {% if panel.CTA %}
            <a href="{{ site.url }}{{ panel.CTA_url }}" class="btn btn-primary" title="{{ panel.CTA_title | default: 'Contact us' }}">
              {{ panel.CTA | default: "Get in touch" }}
            </a>
          {% endif %}
        </div>

      </article>
    </div>
  </section>
